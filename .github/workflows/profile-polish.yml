name: Final Profile Polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write final profile README
        shell: bash
