<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="32" y1="18" x2="1168" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080C18">
        <animate attributeName="stop-color" values="#080C18;#0C1120;#080C18" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.54" stop-color="#12172B">
        <animate attributeName="stop-color" values="#12172B;#17152D;#12172B" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#10232B">
        <animate attributeName="stop-color" values="#10232B;#17122A;#10232B" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="42" x2="1100" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7C948"/>
      <stop offset="0.5" stop-color="#9B8CFF"/>
      <stop offset="1" stop-color="#5CE1E6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5CE1E6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5CE1E6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5CE1E6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.032"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="27" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <circle cx="1120" cy="35" r="145" fill="#8B5CF6" fill-opacity="0.065">
    <animate attributeName="fill-opacity" values="0.04;0.095;0.04" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="285" r="175" fill="#22D3EE" fill-opacity="0.05">
    <animate attributeName="fill-opacity" values="0.03;0.07;0.03" dur="10s" repeatCount="indefinite"/>
  </circle>

  <rect x="706" y="0" width="76" height="300" fill="url(#scan)" opacity="0">
    <animate attributeName="x" values="700;1130" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.34;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect x="62" y="43" width="8" height="214" rx="4" fill="url(#accent)"/>

  <text x="98" y="92" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">Mahmoud Nagiub</text>
  <text x="100" y="134" fill="#C2CAE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Software Engineering Student · AI/ML Focus</text>
  <text x="100" y="180" fill="#EEF2F8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Building reliable AI products from model to deployment.</text>
  <text x="100" y="220" fill="#9DA8BF" font-family="JetBrains Mono, Consolas, monospace" font-size="15">RAG · COMPUTER VISION · BACKEND APIs · TESTING · DEPLOYMENT</text>

  <g font-family="JetBrains Mono, Consolas, monospace" font-size="13">
    <text x="100" y="255" fill="#5CE1E6">&gt; shipping end-to-end systems</text>
    <rect x="333" y="242" width="8" height="17" rx="1" fill="#5CE1E6">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(790 33)">
    <g transform="translate(184 0)">
      <circle cx="0" cy="0" r="4" fill="#34D399">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="12" y="5" fill="#86EFAC" font-family="JetBrains Mono, Consolas, monospace" font-size="11">BUILD PIPELINE ONLINE</text>
    </g>

    <path d="M65 63L170 28L275 77L270 181L158 225L53 167L65 63Z" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.72" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M65 63L158 225M170 28L53 167M275 77L158 225M65 63L275 77M53 167L270 181M170 28L270 181" stroke="#FFFFFF" stroke-opacity="0.11" stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="6s" repeatCount="indefinite"/>
    </path>

    <circle cx="65" cy="63" r="8" fill="#F7C948"><animate attributeName="r" values="8;11;8" dur="2.8s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="28" r="8" fill="#9B8CFF"><animate attributeName="r" values="8;11;8" dur="2.8s" begin="0.45s" repeatCount="indefinite"/></circle>
    <circle cx="275" cy="77" r="8" fill="#5CE1E6"><animate attributeName="r" values="8;11;8" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="181" r="8" fill="#F472B6"><animate attributeName="r" values="8;11;8" dur="2.8s" begin="1.35s" repeatCount="indefinite"/></circle>
    <circle cx="158" cy="225" r="8" fill="#60A5FA"><animate attrributeName="r" values="8;11;8" dur="2.8s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="53" cy="167" r="8" fill="#34D399"><animate attributeName="r" values="8;11;8" dur="2.8s" begin="2.25s" repeatCount="indefinite"/></circle>

    <g fill="#D7DDEC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
      <text x="30" y="49">DATA</text>
      <text x="146" y="10">MODEL</text>
      <text x="284" y="81">RAG</text>
      <text x="280" y="201">API</text>
      <text x="136" y="250">TEST</text>
      <text x="5" y="190">DEPLOY</text>
    </g>

    <rect x="108" y="105" width="112" height="46" rx="14" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.14">
      <animate attributeName="stroke-opacity" values="0.12;0.32;0.12" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="138" y="125" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">BUILD</text>
    <text x="126" y="142" fill="#9AA5BC" font-family="JetBrains Mono, Consolas, monospace" font-size="11">END TO END</text>
  </g>
</svg>
